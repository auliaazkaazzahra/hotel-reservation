[pytest]
# Pytest configuration untuk Hotel Reservation System

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=95

# Markers untuk kategorisasi tests
markers =
    unit: Unit tests untuk isolated components
    integration: Integration tests untuk API endpoints
    slow: Tests yang membutuhkan waktu lama
    auth: Tests untuk authentication/authorization
    domain: Tests untuk domain layer
    service: Tests untuk application service layer
    api: Tests untuk REST API

# Coverage options
[coverage:run]
source = src
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod